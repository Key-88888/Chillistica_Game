name: Windows Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match "refs/tags/(?<tag>v.+)") {
              $version = $Matches["tag"]
          }
          else {
              $version = "dev-$env:GITHUB_RUN_NUMBER"
          }

          "CHILLISTICA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Build release package
        shell: pwsh
        env:
          CHILLISTICA_SIGNING_KEY_PEM: ${{ secrets.CHILLISTICA_SIGNING_KEY_PEM }}
        run: |
          .\scripts\build-release.ps1 -Version $env:CHILLISTICA_VERSION

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64
          path: |
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip.sig

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chillistica_game ${{ env.CHILLISTICA_VERSION }}
          tag_name: ${{ env.CHILLISTICA_VERSION }}
          generate_release_notes: true
          files: |
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip.sig

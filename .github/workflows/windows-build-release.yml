name: Windows Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        # Pinned to a commit SHA (not the mutable @v4 tag): this job can hold the
        # release signing secret, so a repointed action tag must not run code here.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match "refs/tags/(?<tag>v.+)") {
              $version = $Matches["tag"]
              $assemblyVersion = $version -replace '^v', ''
          }
          else {
              $version = "dev-$env:GITHUB_RUN_NUMBER"
              $assemblyVersion = "0.0.$env:GITHUB_RUN_NUMBER"
          }

          "CHILLISTICA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHILLISTICA_ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Build release package
        shell: pwsh
        env:
          CHILLISTICA_SIGNING_KEY_PEM: ${{ secrets.CHILLISTICA_SIGNING_KEY_PEM }}
        run: |
          .\scripts\build-release.ps1 -Version $env:CHILLISTICA_VERSION -AssemblyVersion $env:CHILLISTICA_ASSEMBLY_VERSION

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64
          if-no-files-found: error
          path: |
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip.sig
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64-standalone.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64-standalone.zip.sig

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Chillistica_game ${{ env.CHILLISTICA_VERSION }}
          tag_name: ${{ env.CHILLISTICA_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64.zip.sig
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64-standalone.zip
            artifacts/release/Chillistica_game-${{ env.CHILLISTICA_VERSION }}-win-x64-standalone.zip.sig

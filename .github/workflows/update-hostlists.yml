name: Update hostlists (auto)

# Nightly: refresh the per-app winws hostlists from the maintained upstream
# domain-list project, re-pin their SHA256, and -- only if something actually
# changed -- bump the patch version and cut a SIGNED release through the same
# trusted channel. Hostlists are data-only (they pick which hosts get desynced,
# never what winws does), so this is safe to automate end to end.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hostlists
  cancel-in-progress: false

jobs:
  refresh-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Pinned to commit SHAs (not mutable tags): this job holds the release
        # signing secret, so a repointed action tag must not run code here.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Refresh hostlists + re-pin hashes
        id: upd
        shell: pwsh
        run: .\scripts\update-hostlists.ps1

      - name: Bump version, commit, tag
        id: bump
        if: steps.upd.outputs.changed == 'true'
        shell: pwsh
        run: |
          $appCsproj = "Chillistica_game.App/Chillistica_game.App.csproj"
          $svcCsproj = "Chillistica_game.Service/Chillistica_game.Service.csproj"
          $content = Get-Content $appCsproj -Raw
          if ($content -match '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
            $new = "{0}.{1}.{2}" -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
          } else {
            throw "Version not found in $appCsproj"
          }
          foreach ($c in @($appCsproj, $svcCsproj)) {
            ((Get-Content $c -Raw) -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$new</Version>") |
              Set-Content $c -NoNewline
          }
          $tag = "v$new"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(hostlists): refresh from upstream + re-pin hashes ($tag)"
          git tag $tag
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin $tag
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build signed release package
        if: steps.upd.outputs.changed == 'true'
        shell: pwsh
        env:
          CHILLISTICA_SIGNING_KEY_PEM: ${{ secrets.CHILLISTICA_SIGNING_KEY_PEM }}
        run: .\scripts\build-release.ps1 -Version ${{ steps.bump.outputs.version }}

      - name: Publish GitHub Release
        if: steps.upd.outputs.changed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Chillistica_game ${{ steps.bump.outputs.version }}
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/release/Chillistica_game-${{ steps.bump.outputs.version }}-win-x64.zip
            artifacts/release/Chillistica_game-${{ steps.bump.outputs.version }}-win-x64.zip.sig
